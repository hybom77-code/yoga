<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananta · Portal de Bienestar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>

<div class="wrap">

<div style="position:absolute;top:15px;right:15px;z-index:100;">
  <select id="tenant-selector" onchange="setTenant(this.value)" style="background:var(--bg);color:var(--text2);border:0.5px solid var(--border);border-radius:10px;padding:6px 10px;font-family:'Cormorant Garamond',serif;font-size:13px;cursor:pointer;outline:none;">
    <option value="ananta">✧ Ananta (Púrpura)</option>
    <option value="zenith">✧ Zenith (Esmeralda)</option>
    <option value="lumina">✧ Lumina (Azul)</option>
  </select>
</div>

<!-- ════════════════ ORÁCULO ════════════════ -->
<div id="screen-oracle" class="screen active">
  <button class="back-btn" onclick="goTo('home')">← Inicio</button>
  <div class="card">
    <span class="section-lbl">¿Qué buscas hoy?</span>
    <div class="oracle-intent">
      <div class="int-btn sel" data-int="claridad">🌕 Claridad</div>
      <div class="int-btn" data-int="amor">♡ Amor</div>
      <div class="int-btn" data-int="propósito">✦ Propósito</div>
      <div class="int-btn" data-int="sanación">🌿 Sanación</div>
      <div class="int-btn" data-int="creatividad">🎨 Creatividad</div>
      <div class="int-btn" data-int="abundancia">✧ Abundancia</div>
    </div>
  </div>
  <div class="card">
    <span class="section-lbl">Tipo de tirada</span>
    <div class="sel-grid" id="oracle-tipo">
      <span class="sel-chip sel" data-g="otipo" data-v="1">1 carta · Mensaje del día</span>
      <span class="sel-chip" data-g="otipo" data-v="3">3 cartas · Pasado / Presente / Futuro</span>
    </div>
  </div>
  <button class="btn-main" id="oracle-gen-btn" onclick="generateOracle()">✦ Consultar el oráculo ✦</button>

  <div class="loading-screen" id="oracle-loading">
    <span class="luna-anim">🔮</span>
    <div class="loading-txt">Las cartas se revelan...</div>
  </div>
  <div id="oracle-error"></div>
  <div id="oracle-result" style="display:none">
    <div style="margin-top:1rem">
      <div class="cards-row" id="oracle-cards"></div>
      <div class="oracle-msg" id="oracle-msg">
        <div class="oracle-msg-lbl">Mensaje del oráculo</div>
        <div class="oracle-msg-txt" id="oracle-msg-txt"></div>
      </div>
      <div style="text-align:center;margin-top:1rem">
        <button class="btn-secondary" onclick="resetOracle()">Nueva consulta</button>
      </div>
    </div>
  </div>
</div>

  <div style="margin-top: 2rem; margin-bottom: 2rem; text-align: center;">
    <button class="btn-secondary" onclick="goTo('premium')">✧ Ver planes premium ✧</button>
  </div>
</div><!-- /wrap -->

<!-- ════ BOTTOM NAV ════ -->
<nav class="bottom-nav">
  <div class="nav-item" id="nav-home" onclick="goTo('home')">
    <span class="nav-icon">☽</span>
    <span class="nav-lbl">Inicio</span>
  </div>
  <div class="nav-item" id="nav-yoga" onclick="goTo('yoga')">
    <span class="nav-icon">🧘</span>
    <span class="nav-lbl">Yoga</span>
  </div>
  <div class="nav-item" id="nav-astro" onclick="goTo('astro')">
    <span class="nav-icon">✨</span>
    <span class="nav-lbl">Astrológico</span>
  </div>
  <div class="nav-item" id="nav-oracle" onclick="goTo('oracle')">
    <span class="nav-icon">🔮</span>
    <span class="nav-lbl">Oráculo</span>
  </div>
  <div class="nav-item" id="nav-breath" onclick="goTo('breath')">
    <span class="nav-icon">🌬️</span>
    <span class="nav-lbl">Breath</span>
  </div>
</nav>

<script src="script.js"></script>
</body>
</html>
