<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ananta · Planes Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>

<div class="wrap">

<div style="position:absolute;top:15px;right:15px;z-index:100;">
  <select id="tenant-selector" onchange="setTenant(this.value)" style="background:var(--bg);color:var(--text2);border:0.5px solid var(--border);border-radius:10px;padding:6px 10px;font-family:'Cormorant Garamond',serif;font-size:13px;cursor:pointer;outline:none;">
    <option value="ananta">✧ Ananta (Púrpura)</option>
    <option value="zenith">✧ Zenith (Esmeralda)</option>
    <option value="lumina">✧ Lumina (Azul)</option>
  </select>
</div>

<!-- ════════════════ PREMIUM ════════════════ -->
<div id="screen-premium" class="screen active">
  <button class="back-btn" onclick="goTo('home')">← Inicio</button>
  
  <div class="card" style="text-align: center; padding: 2rem 1.5rem;">
    <span class="mod-icon" style="font-size: 3rem; margin-bottom: 1rem; display: block;">💎</span>
    <h2 style="font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: .1em; color: var(--text); text-transform: uppercase; margin-bottom: 1rem;">Planes Premium</h2>
    <p style="font-size: 1.1rem; color: var(--text2); font-style: italic; line-height: 1.6; margin-bottom: 2rem;">
      Estamos puliendo los últimos detalles de esta función. Deja tu correo para ser el primero en entrar con 50% de descuento.
    </p>

    <form action="https://formsubmit.co/hybom77@gmail.com" method="POST" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
      <input type="hidden" name="_subject" value="¡Nuevo interesado en Planes Premium Ananta!">
      <input type="hidden" name="_captcha" value="false">

      <div>
        <label for="nombre" style="font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: .2em; color: var(--text3); text-transform: uppercase; margin-bottom: .4rem; display: block;">Nombre</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" style="width: 100%; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 16px; outline: none;">
      </div>
      
      <div>
        <label for="email" style="font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: .2em; color: var(--text3); text-transform: uppercase; margin-bottom: .4rem; display: block;">Correo Electrónico</label>
        <input type="email" id="email" name="email" required placeholder="tu@correo.com" style="width: 100%; background: rgba(255,255,255,0.03); border: 0.5px solid var(--border); border-radius: 10px; padding: 12px; color: var(--text); font-family: 'Cormorant Garamond', serif; font-size: 16px; outline: none;">
      </div>

      <button type="submit" class="btn-main" style="margin-top: 1rem;">✦ Quiero mi 50% de descuento ✦</button>
    </form>
  </div>
</div>

</div><!-- /wrap -->

<!-- ════ BOTTOM NAV ════ -->
<nav class="bottom-nav">
  <div class="nav-item" id="nav-home" onclick="goTo('home')">
    <span class="nav-icon">☽</span>
    <span class="nav-lbl">Inicio</span>
  </div>
  <div class="nav-item" id="nav-yoga" onclick="goTo('yoga')">
    <span class="nav-icon">🧘</span>
    <span class="nav-lbl">Yoga</span>
  </div>
  <div class="nav-item" id="nav-astro" onclick="goTo('astro')">
    <span class="nav-icon">✨</span>
    <span class="nav-lbl">Astrológico</span>
  </div>
  <div class="nav-item" id="nav-oracle" onclick="goTo('oracle')">
    <span class="nav-icon">🔮</span>
    <span class="nav-lbl">Oráculo</span>
  </div>
  <div class="nav-item" id="nav-breath" onclick="goTo('breath')">
    <span class="nav-icon">🌬️</span>
    <span class="nav-lbl">Breath</span>
  </div>
</nav>

<script src="script.js"></script>
</body>
</html>
