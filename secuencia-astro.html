<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secuencia Astrológica · Portal de Bienestar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- jsPDF and html2pdf bundle -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="stars"></div>

<div class="wrap">

<div style="position:absolute;top:15px;right:15px;z-index:100;">
  <select id="tenant-selector" onchange="setTenant(this.value)" style="background:var(--bg);color:var(--text2);border:0.5px solid var(--border);border-radius:10px;padding:6px 10px;font-family:'Cormorant Garamond',serif;font-size:13px;cursor:pointer;outline:none;">
    <option value="ananta">✧ Ananta (Púrpura)</option>
    <option value="zenith">✧ Zenith (Esmeralda)</option>
    <option value="lumina">✧ Lumina (Azul)</option>
  </select>
</div>

<div id="screen-secuencia-astro" class="screen active">
  <button class="back-btn" onclick="goTo('astro')">← Volver a Generador Astro</button>
  
  <div class="card" style="margin-bottom: 2rem;">
    <!-- Container for html2pdf export -->
    <div id="pdf-content-astro">
      <div class="loading-screen on" id="seq-loading-astro">
        <span class="luna-anim">✨</span>
        <div class="loading-txt">Alineando los astros...</div>
      </div>
      <div id="astro-warning" style="display:none; margin-bottom: 15px; padding: 10px; border-radius: 8px; background-color: var(--purple-soft); border: 1px solid var(--accent); color: var(--text); font-size: 0.9rem; text-align: center;"></div>
      <div id="astro-seq"></div>
    </div>
    
    <!-- Acción: Iniciar Secuencia y PDF -->
    <div id="seq-actions-astro" style="display:none; gap: 10px; margin-top: 1.5rem; justify-content: center; flex-wrap: wrap; align-items: center;">
      <button class="btn-fav" id="btn-fav-astro" onclick="toggleFavorite('astro')" title="Guardar en Favoritos">🤍</button>
      <button class="btn-main" style="flex:1; max-width:200px; margin:0;" id="start-train-btn-astro" onclick="openAstroTrainingMode()">▶ Iniciar Secuencia</button>
      <button class="btn-secondary" style="margin-top: 0.5rem; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 200px; font-size: 11px;" id="download-pdf-btn-astro" onclick="downloadAstroPDF()">
        <span style="font-size: 14px;">📄</span> Guardar como PDF
      </button>
    </div>
  </div>
</div>

  <div style="margin-top: 2rem; margin-bottom: 2rem; text-align: center;">
    <button class="btn-secondary" onclick="goTo('premium')">✧ Ver planes premium ✧</button>
  </div>
</div><!-- /wrap -->

<!-- ════ MODO ENTRENAMIENTO ASTRO (FULLSCREEN) ════ -->
<div id="training-overlay-astro" class="training-overlay">
  <button id="music-btn" class="training-btn-top-left" onclick="toggleMusic()" title="Música Holística (Frecuencia Om 108Hz)">🎵 Música</button>
  <button class="training-close" onclick="closeAstroTrainingMode()">✕</button>
  <div class="training-content">
    <div class="training-fase" id="a-fase">Fase: Apertura</div>
    <div class="training-pose" id="a-pose">Nombre de la Asana</div>
    <div class="training-pose-es" id="a-pose-es">Traducción</div>
    
    <div class="training-timer" id="a-num">00:00</div>
    
    <div class="prog" style="width: 80%; max-width: 400px; margin: 1.5rem auto;"><div class="prog-fill" id="a-bar"></div></div>
    
    <div class="tctrls" style="margin-top: 2rem; transform: scale(1.2);">
      <button class="tbtn" onclick="astroPrev()">←</button>
      <button class="tbtn pri" style="min-width: 100px;" id="a-playbtn" onclick="astroToggle()">▶ Iniciar</button>
      <button class="tbtn" onclick="astroNext()">→</button>
    </div>
    <div class="tcnt" id="a-cnt" style="margin-top: 1rem; font-size: 0.8rem; color: rgba(255,255,255,0.5);"></div>
  </div>
</div>

<!-- ════ BOTTOM NAV ════ -->
<nav class="bottom-nav">
  <div class="nav-item" id="nav-home" onclick="goTo('home')">
    <span class="nav-icon">☽</span>
    <span class="nav-lbl">Inicio</span>
  </div>
  <div class="nav-item" id="nav-yoga" onclick="goTo('yoga')">
    <span class="nav-icon">🧘</span>
    <span class="nav-lbl">Yoga</span>
  </div>
  <div class="nav-item" id="nav-astro" onclick="goTo('astro')">
    <span class="nav-icon">✨</span>
    <span class="nav-lbl">Astrológico</span>
  </div>
  <div class="nav-item" id="nav-oracle" onclick="goTo('oracle')">
    <span class="nav-icon">🔮</span>
    <span class="nav-lbl">Oráculo</span>
  </div>
  <div class="nav-item" id="nav-breath" onclick="goTo('breath')">
    <span class="nav-icon">🌬️</span>
    <span class="nav-lbl">Breath</span>
  </div>
</nav>

<script src="script.js"></script>
</body>
</html>
